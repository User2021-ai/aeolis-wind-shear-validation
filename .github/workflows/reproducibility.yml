name: Reproducibility checks

on:
  push:
  pull_request:

jobs:
  b01-roughness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}/source/aeolis-python
      MPLCONFIGDIR: ${{ runner.temp }}/b01-matplotlib
    steps:
      - uses: actions/checkout@v4
      - name: Check out audited AeoLiS source
        uses: actions/checkout@v4
        with:
          repository: openearth/aeolis-python
          ref: 1fcbe86d173f964e6ee231c0ee917ca3a6cd3f5e
          path: source/aeolis-python
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify imported source and save environment
        id: source
        run: |
          python -c "import inspect, os; from pathlib import Path; from aeolis.shear import WindShear; actual = Path(inspect.getfile(WindShear)).resolve(); expected = Path(os.environ['PYTHONPATH']) / 'aeolis' / 'shear.py'; assert actual == expected.resolve(), actual; print(actual)"
          python -m pip freeze > "${RUNNER_TEMP}/b01-environment.txt"
      - name: Reproduce the known B01 failure
        run: |
          python AeoLiS_Investigation/07_reproducibility/scripts/b01_roughness_reproducer.py \
            --output "${RUNNER_TEMP}/b01-results.json"
      - name: Test proposed roughness safeguard
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          python -m unittest discover \
            -s AeoLiS_Investigation/07_reproducibility/scripts \
            -p test_b01_roughness_guard.py -v
      - name: Preserve B01 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-evidence
          path: |
            ${{ runner.temp }}/b01-results.json
            ${{ runner.temp }}/b01-environment.txt
          retention-days: 30
          if-no-files-found: warn
  shear-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run shear sanity checks
        run: |
          python AeoLiS_Investigation/07_reproducibility/scripts/shear_sanity_checks.py \
            --output /tmp/shear_sanity_results.json

